name: CI

on:
  push:
  pull_request:

jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_DB: postgres
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Fetch production-hardening for migration comparison
        run: |
          git fetch origin production-hardening:production-hardening \
            || git fetch origin production-hardening \
            || true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install psql
        run: sudo apt-get update && sudo apt-get install -y postgresql-client
      - name: Install backend dependencies
        run: pip install -r backend/requirements.txt
      - name: Run Python tests
        run: pytest
        env:
          APP_ENV: test
          JWT_SECRET: test-secret-not-for-production-use-32b
          DATABASE_URL: postgresql://postgres@localhost:5432/postgres
          TEST_DATABASE_URL: postgresql://postgres@localhost:5432/postgres
          DATABASE_ADMIN_URL: postgresql://postgres@localhost:5432/postgres
